<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shoplist</title>
    <style>
        ul {
            list-style-type: none; /* Убираем маркеры списка */
            padding: 0; /* Убираем отступы */
        }
        li {
            display: flex; /* Используем Flexbox для расположения элементов в строку */
            align-items: center; /* Центрируем элементы по вертикали */
            margin-bottom: 20px; /* Отступ между элементами списка */
        }
        h3 {
            margin: 0; /* Убираем отступы по умолчанию от заголовка */
            margin-right: 10px; /* Добавляем отступ между заголовком и кнопкой */
        }

        button {
            /* Можно добавить стиль кнопки, если нужно */
        }
    </style>
</head>
<body>
    <h1>Аксессуары</h1>
    <br>
    <ul>
        <li>
            <h3>Серьги</h3>
            <button>Купить</button>
        </li>
        <li>
            <h3>Кольца</h3>
            <button>Купить</button>
        </li>
        <li>
            <h3>Часы</h3>
            <button>Купить</button>
        </li>
    </ul>
    <button><a href="/">Вернуться обратно</a></button>
</body>
</html>
